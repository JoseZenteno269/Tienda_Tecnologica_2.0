<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Tecnologica 2.0</title>
    <link rel="stylesheet" href="Css/Productos.css">
</head>

<body>
    <header>
        <h2>Tienda Tecnologica</h2>
        <a href="Compras.html">📦 Mis Compras</a>
    </header>

    <main>
        <section id="section-productos">
            <div class="contenedor-titulo">
                <h2>Catálogo de Productos</h2>
            </div>
            <div class="contenedor-filtros">
                <select id="ddl-categorias">
                    <option value="0">Todas las categorías</option>
                </select>
                <div class="grupo-busqueda">
                    <input type="text" id="txt-texto">
                    <button id="btn-buscar">
                        <div class="lupa"></div>
                    </button>
                </div>
                <button id="btn-limpiar">Limpiar</button>
            </div>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Imagen</th>
                            <th>Agregar</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos">

                    </tbody>
                </table>
            </div>
        </section>
        <section id="section-carrito">
            <h2 class="titulo_seccion">Productos Seleccionados</h2>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-seleccionados">

                    </tbody>
                </table>
            </div>
            <div class="contenedor-total">
                <span>Total a Pagar: </span>
                <label id="lbl-total">$ 0.00</label>
            </div>
            <div class="contenedor-acciones">
                <button id="btn-confirmar">Confirmar</button>
                <button id="btn-cancelar">Cancelar</button>
            </div>
            <label id="lbl-mensaje"></label>
        </section>
    </main>

    <footer>
        <p>© 2026 Tienda Tecnológica - Todos los derechos reservados</p>
    </footer>
    <script type="module" src="Javascript/Producto.js"></script>
</body>

</html>
