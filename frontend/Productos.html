<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Tecnologica 2.0</title>
    <!-- <link rel="stylesheet" href="Css/Productos.css"> -->
</head>

<body>
    <header>
        <h1>Catálogo de Productos</h1>
        <a href="Compras.html">Ver Compras</a>
    </header>

    <main>
        <section>
            <select id="ddl-categorias">
                <option value="0">Todas las categorías</option>
            </select>
            <input type="text" id="txt-texto">
            <button id="btn-buscar">Buscar</button>
            <button id="btn-limpiar">Limpiar</button>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Imagen</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos">

                </tbody>
            </table>
        </section>
        <section>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody id="tabla-seleccionados">

                </tbody>
            </table>
            <div>
                <span>Total a Pagar: </span>
                <label id="lbl-total">$ 0.00</label>
            </div>
            <button id="btn-confirmar">Confirmar</button>
            <button id="btn-cancelar">Cancelar</button>
        </section>
        <label id="lbl-mensaje"></label>
    </main>

    <footer>

    </footer>
    <script type="module" src="Javascript/Producto.js"></script>
</body>

</html>
