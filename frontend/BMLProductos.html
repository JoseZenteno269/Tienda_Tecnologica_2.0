<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Productos — Tienda Tecnológica 2.0</title>
    <link rel="stylesheet" href="Css/Base.css">
    <link rel="stylesheet" href="Css/BMLProductos.css">
</head>

<body>
    <header>
        <a class="marca" href="Productos.html">⚡ <span>Tienda Tecnológica</span></a>
        <nav>
            <a href="Productos.html">🛍️ Catálogo</a>
            <a href="AgregarProductos.html">➕ Agregar</a>
            <a href="BMLProductos.html" class="activo">🛠️ Gestionar</a>
            <a href="Compras.html">🛒 Mis Compras</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="contenedor-titulo">
                <h2>Gestión de Productos</h2>
            </div>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Imagen</th>
                            <th>Estado</th>
                            <th>Modificar</th>
                            <th>Baja</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos">

                    </tbody>
                </table>
            </div>
            <label id="lbl-mensaje"></label>
        </section>
    </main>

    <footer>
        <p>© 2026 Tienda Tecnológica - Todos los derechos reservados</p>
    </footer>
    <script src="Javascript/BMLProductos.js" type="module"></script>
